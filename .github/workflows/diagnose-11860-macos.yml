name: Diagnose Pylint 11860 on macOS

on:
  push:
    branches: [diagnostic/11860-macos]
    paths: [.github/workflows/diagnose-11860-macos.yml]

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'hector2394/pylint'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out reported downstream revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: approvals/ApprovalTests.Python
          ref: 668eff9adb50781373acc32aa0bc71aa5dfe9121
          path: ApprovalTests.Python
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: false

      - name: Install reported environment
        working-directory: ApprovalTests.Python
        run: |
          uv python install 3.11.15
          uv venv --python 3.11.15 .venv
          uv pip install --python .venv/bin/python -r requirements.dev.txt
          uv pip install --python .venv/bin/python pylint==4.1.4 astroid==4.3.4

      - name: Compare revisions and capture shutdown errors
        working-directory: ApprovalTests.Python
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path
          import subprocess
          import sys

          output = Path('../diagnostic-results').resolve()
          output.mkdir()
          environment = {
              'platform': platform.platform(),
              'machine': platform.machine(),
              'python': sys.version,
              'mac_version': platform.mac_ver(),
          }
          (output / 'environment.json').write_text(json.dumps(environment, indent=2))
          freeze = subprocess.check_output(['uv', 'pip', 'freeze', '--python', sys.executable])
          (output / 'requirements.txt').write_bytes(freeze)
          print(json.dumps(environment), flush=True)
          results = []
          revisions = [
              '32ccbd1d18ab2049227244684011e9487b0de306',
              '668eff9adb50781373acc32aa0bc71aa5dfe9121',
          ]
          for revision in revisions:
              subprocess.run(['git', 'checkout', '--detach', revision], check=True)
              for seed in (0, 1):
                  label = f'{revision[:8]}-seed-{seed}'
                  env = os.environ.copy()
                  env['PYTHONHASHSEED'] = str(seed)
                  env['PYLINTHOME'] = str(output / f'cache-{label}')
                  process = subprocess.run(
                      [sys.executable, '-m', 'pylint', '.'],
                      env=env, capture_output=True, timeout=180,
                  )
                  (output / f'{label}.stdout.log').write_bytes(process.stdout)
                  (output / f'{label}.stderr.log').write_bytes(process.stderr)
                  result = {
                      'revision': revision, 'seed': seed,
                      'exit_code': process.returncode,
                      'stderr_bytes': len(process.stderr),
                      'reported_error': b'generator already executing' in process.stderr,
                  }
                  results.append(result)
                  (output / 'results.json').write_text(json.dumps(results, indent=2))
                  print(json.dumps(result), flush=True)
                  print(process.stderr.decode(errors='replace'), flush=True)
          PY

      - name: Capture inference frames from the failing revision
        working-directory: ApprovalTests.Python
        shell: bash
        run: |
          mkdir ../diagnostic-results/hook
          cat > ../diagnostic-results/hook/sitecustomize.py <<'PY'
          import gc
          import json
          import sys
          import types

          def describe(value):
              description = {'type': type(value).__name__}
              try:
                  attributes = object.__getattribute__(value, '__dict__')
              except AttributeError:
                  attributes = {}
              for attribute in ('name', 'attrname', 'lineno', 'file'):
                  item = attributes.get(attribute)
                  if isinstance(item, (str, int)):
                      description[attribute] = item
              return description

          def capture(event, encode=json.dumps, stream=sys.stderr, generator_type=types.GeneratorType, objects=gc.get_objects, describe=describe):
              frames = []
              traceback = event.exc_traceback
              while traceback is not None:
                  frame = traceback.tb_frame
                  values = {}
                  for name, value in frame.f_locals.items():
                      description = describe(value)
                      if isinstance(value, generator_type):
                          description['generator'] = value.gi_code.co_name
                          description['running'] = value.gi_running
                      values[name] = description
                  frames.append({'function': frame.f_code.co_name, 'line': traceback.tb_lineno, 'locals': values})
                  traceback = traceback.tb_next
              stream.write('INFERENCE_SHUTDOWN ' + encode(frames) + '\n')
              running = []
              for value in objects():
                  if isinstance(value, generator_type) and value.gi_running and value.gi_frame is not None:
                      running.append({
                          'function': value.gi_code.co_name,
                          'line': value.gi_frame.f_lineno,
                          'locals': {key: describe(item) for key, item in value.gi_frame.f_locals.items()},
                      })
              stream.write('RUNNING_INFERENCE ' + encode(running) + '\n')
              stream.flush()

          sys.unraisablehook = capture
          PY
          PYTHONHASHSEED=0 PYTHONPATH="$PWD/../diagnostic-results/hook" \
            .venv/bin/python -m pylint . \
            > ../diagnostic-results/inference-frames.stdout.log \
            2> ../diagnostic-results/inference-frames.stderr.log
          cat ../diagnostic-results/inference-frames.stderr.log

      - name: Compare explicit iteration during inference cleanup
        working-directory: ApprovalTests.Python
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          import astroid.nodes.node_classes

          path = Path(astroid.nodes.node_classes.__file__)
          source = path.read_text()
          before = '                yield from owner.igetattr(node.attrname, context)'
          after = '                for result in owner.igetattr(node.attrname, context):\n                    yield result'
          assert source.count(before) == 1
          path.write_text(source.replace(before, after))
          output = Path('../diagnostic-results').resolve()
          for seed in (0, 1):
              env = os.environ.copy()
              env['PYTHONHASHSEED'] = str(seed)
              env['PYLINTHOME'] = str(output / f'iteration-cache-{seed}')
              result = subprocess.run([sys.executable, '-m', 'pylint', '.'], env=env, capture_output=True, timeout=180)
              (output / f'iteration-seed-{seed}.stdout.log').write_bytes(result.stdout)
              (output / f'iteration-seed-{seed}.stderr.log').write_bytes(result.stderr)
              print(f'Explicit iteration seed={seed} exit={result.returncode} stderr_bytes={len(result.stderr)}')
              print(result.stderr.decode(errors='replace'))
          PY

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pylint-11860-macos
          path: diagnostic-results
          if-no-files-found: warn
          retention-days: 14
